name: Publicar versión
on:
  push:
    branches: [main]
    paths: ['instaladores/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear la versión con el instalador más reciente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(ls instaladores/Chongqing_POS_Setup_*.exe | sort -V | tail -1)
          VER=$(basename "$EXE" .exe | sed 's/Chongqing_POS_Setup_//')
          NOTAS="instaladores/notas-$VER.md"; [ -f "$NOTAS" ] || NOTAS=/dev/null
          # copia con nombre fijo para el enlace corto de descarga
          cp "$EXE" Chongqing_POS_Setup.exe
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$EXE" Chongqing_POS_Setup.exe --clobber
          else
            gh release create "v$VER" "$EXE" Chongqing_POS_Setup.exe --title "Chongqing POS $VER" --notes-file "$NOTAS" --latest
          fi
